# Deploys server/ — infra (Bicep) then code (Functions) — on push to main.
#
# NO STORED AZURE CREDENTIAL. `azure/login` here uses OIDC: GitHub mints a
# short-lived, workflow-scoped OIDC token and Entra trusts it via a
# federated credential on a deployment service principal — configured once,
# manually (az command below), not by this file. The three values this
# workflow reads (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID)
# are IDs, not passwords — stored as repository VARIABLES, not secrets,
# because there is no client secret anywhere in this pipeline for a leaked
# value to even be.
#
# ONE-TIME SETUP (run once, by someone with Entra + subscription rights):
#
#   az ad sp create-for-rbac --name odyssey-deploy --create-cert=false \
#     --role Contributor --scopes /subscriptions/<sub-id>/resourceGroups/<rg>
#   # ^ note the appId this prints — that's AZURE_CLIENT_ID
#
#   az ad app federated-credential create --id <appId-from-above> --parameters '{
#     "name": "github-main-branch",
#     "issuer": "https://token.actions.githubusercontent.com",
#     "subject": "repo:<org>/<repo>:ref:refs/heads/main",
#     "audiences": ["api://AzureADTokenExchange"]
#   }'
#
#   # Also needs Cosmos data-plane access to run schema-adjacent operations
#   # if this pipeline ever seeds data (it doesn't today — deploy-infra only
#   # creates the account, deploy-code only ships Function code). Skip unless
#   # a future job needs it.
#
# Then set AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID as
# repository (or environment) variables — plain, non-secret values — plus
# the deployment parameters below as repository secrets/variables per your
# org's convention for things like an alert email.

name: Deploy server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC — this is what replaces a stored credential
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: server/dist
          retention-days: 7

  deploy-infra:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production # gate this in GitHub's Environments settings for a manual approval step
    outputs:
      # arm-deploy exposes every Bicep output as ONE JSON blob
      # (`deploymentOutputs`), not as individual step outputs — this pulls
      # the one value the next job needs out of it.
      functionAppName: ${{ fromJson(steps.deploy.outputs.deploymentOutputs).functionAppName.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: server/infra/main.bicep
          parameters: >
            entraTenantId=${{ vars.ENTRA_TENANT_ID }}
            entraApiAudience=${{ vars.ENTRA_API_AUDIENCE }}
            alertEmail=${{ vars.ALERT_EMAIL }}
            corsAllowedOrigins=${{ vars.CORS_ALLOWED_ORIGINS_JSON }}
            location=${{ vars.AZURE_LOCATION }}
          deploymentMode: Incremental

  deploy-code:
    needs: deploy-infra
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: function-app
          path: server/dist
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.deploy-infra.outputs.functionAppName }}
          package: server
          # Managed-Identity-based deployment (no publish profile / no
          # deployment credential) — consistent with the rest of this
          # project's "no secrets" rule.
          respect-funcignore: true
