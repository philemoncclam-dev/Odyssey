<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- The app mark, as the tab icon: the same cube as `shell/Logo.tsx`, in the
       same rounded square it sits in at the top left of the Model Viewer.

       Two deliberate differences from the in-app mark, both because a favicon
       renders at 16px on a browser tab we do not control:

       1. The square is FILLED rather than transparent-on-hover. The in-app mark
          inherits the page's text colour, which would vanish against a tab
          strip of the same shade — a light tab in dark mode, or the reverse.
          A filled tile carries its own contrast either way, so this needs no
          prefers-color-scheme variant to stay visible.
       2. The stroke is heavier. At 16px a 1.8 stroke on a 24 grid lands under
          one device pixel and greys out into a smudge. It is set to 3 rather
          than the intended 2.4 because the group's 0.78 scale shrinks the
          stroke along with the geometry — 3 x 0.78 is the 2.34 actually wanted
          on the 24 grid.

       Colours are the resolved LIGHT values of --color-accent and --slate-1.
       They are literals because an SVG loaded as a favicon gets no stylesheet
       and cannot read the app's custom properties — so if the accent token
       changes, this file has to be changed with it. -->
  <rect width="24" height="24" rx="5" fill="#0e7490" />
  <g
    transform="translate(12 12) scale(0.78) translate(-12 -13)"
    fill="none"
    stroke="#fdfdfe"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M4 17V9l8-5 8 5v8l-8 5-8-5Z" />
    <path d="M4 9l8 5 8-5M12 14v8" />
  </g>
</svg>
